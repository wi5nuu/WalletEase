spring:
  application:
    name: payflow

  datasource:
    url: jdbc:h2:mem:payflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-testing-only-not-for-production-use-32chars}
  access-expiry-ms: 900000      # 15 minutes
  refresh-expiry-ms: 604800000  # 7 days

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

integration:
  service:
    url: http://localhost:8081

internal:
  api:
    key: dev-internal-key

logging:
  level:
    com.payflow: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
