spring:
  application:
    name: payflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USERNAME:payflow}
    password: ${DB_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-here-must-be-at-least-32-characters-long}
  access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}      # 15 minutes
  refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 days

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

integration:
  service:
    url: ${INTEGRATION_SERVICE_URL:http://localhost:8081}

internal:
  api:
    key: ${INTERNAL_API_KEY:internal-secret-key-for-service-communication}

logging:
  level:
    com.payflow: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
